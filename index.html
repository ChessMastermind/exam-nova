<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamNova — IAL Exam Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ALL ORIGINAL EXAMNOVA STYLES PRESERVED */
    :root{--bg:#0e0f1a;--bg3:#1c1d2f;--bdr:#2a2c45;--gold:#c9a84c;--gdim:#7a6230;--teal:#4a9b8f;--red:#c94c6a;--cream:#e8dfc8;--muted:#7a7d99;--white:#f0ecdf;--fh:'Cormorant Garamond',Georgia,serif;--fm:'JetBrains Mono',monospace;--fb:'DM Sans',sans-serif;--r:10px;--shadow:0 4px 32px rgba(0,0,0,.45);--ease:.22s cubic-bezier(.4,0,.2,1)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--cream);font-family:var(--fb);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(201,168,76,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.04) 1px,transparent 1px);background-size:60px 60px}
    .wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 24px}
    header{position:sticky;top:0;z-index:100;background:rgba(14,15,26,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--bdr)}
    .hi{display:flex;align-items:center;gap:12px;padding:13px 24px;max-width:1280px;margin:0 auto}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
    .blogo{width:34px;height:34px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--gold),var(--teal));display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:18px;font-weight:600;color:#0e0f1a}
    .bname{font-family:var(--fh);font-size:21px;font-weight:600;color:var(--white)}
    .bname span{color:var(--gold)}
    .hsp{flex:1}
    .sinfo{font-family:var(--fm);font-size:10px;color:var(--muted)}
    .hero{padding:48px 0 32px}
    .hsup{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
    .hero h1{font-family:var(--fh);font-size:clamp(30px,5vw,54px);font-weight:300;color:var(--white);line-height:1.15;margin-bottom:6px}
    .hero h1 em{font-style:italic;color:var(--gold)}
    .hdesc{color:var(--muted);font-size:13px;max-width:460px}
    .nstrip{margin-bottom:32px;padding:20px 26px;background:linear-gradient(135deg,rgba(201,168,76,.07),rgba(74,155,143,.05));border:1px solid var(--gdim);border-radius:var(--r);display:flex;align-items:center;gap:28px;flex-wrap:wrap}
    .nlbl{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
    .ntitle{font-family:var(--fh);font-size:19px;color:var(--white)}
    .nsub{font-family:var(--fm);font-size:11px;color:var(--teal);margin-top:3px}
    .cdg{display:flex;gap:14px;margin-left:auto}
    .cdb{text-align:center;min-width:42px}
    .cdn{font-family:var(--fm);font-size:30px;font-weight:500;color:var(--gold);line-height:1}
    .cdl2{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
    .sr{display:flex;gap:10px;margin-bottom:22px}
    .si2{flex:1;padding:9px 15px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);color:var(--cream);font-family:var(--fb);font-size:13px;outline:none;transition:var(--ease)}
    .si2::placeholder{color:var(--muted)}.si2:focus{border-color:var(--gdim)}
    .meb{padding:9px 16px;border-radius:var(--r);white-space:nowrap;border:1px solid var(--bdr);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:var(--ease)}
    .meb.on{border-color:var(--teal);color:var(--teal);background:rgba(74,155,143,.08)}
    .mb{margin-bottom:42px}
    .mhd{display:flex;align-items:baseline;gap:14px;padding-bottom:11px;margin-bottom:18px;border-bottom:1px solid var(--bdr)}
    .mn{font-family:var(--fh);font-size:27px;font-weight:300;color:var(--white)}
    .my2{font-family:var(--fm);font-size:11px;color:var(--muted)}
    .mc{margin-left:auto;font-family:var(--fm);font-size:11px;color:var(--muted)}
    .eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
    .ec{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:15px 17px;cursor:default;transition:var(--ease);position:relative;overflow:hidden}
    .ec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
    /* Series Colors */
    .ec.ss::before{background:var(--gold)}.ec.so::before{background:var(--teal)}.ec.sj::before{background:#9b7fcd}.ec.sk::before{background:var(--muted)}
    .ec:hover{border-color:var(--gdim);transform:translateY(-1px);box-shadow:var(--shadow)}
    .ec.mine{border-color:var(--teal)!important}
    .ct{display:flex;gap:11px;margin-bottom:9px}
    .cd2{display:flex;flex-direction:column;align-items:center;min-width:42px;padding:5px 7px;background:rgba(255,255,255,.04);border-radius:6px;flex-shrink:0}
    .cday{font-family:var(--fm);font-size:19px;line-height:1;color:var(--white)}
    .cmon{font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
    .cdow{font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-top:1px}
    .cm{flex:1;min-width:0}
    .cser{font-family:var(--fm);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
    .ss .cser{color:var(--gold)}.so .cser{color:var(--teal)}.sj .cser{color:#9b7fcd}.sk .cser{color:var(--muted)}
    .ctit{font-size:12.5px;color:var(--cream);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .ccod{font-family:var(--fm);font-size:9.5px;color:var(--muted);margin-top:3px}
    .cf{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
    .cdl{font-family:var(--fm);font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.04)}
    .cdl.past{color:var(--muted)}.cdl.today{color:var(--gold)}.cdl.soon{color:#e8a84c}.cdl.future{color:var(--teal)}
    .cbdg{font-family:var(--fm);font-size:9px;padding:1px 6px;border-radius:3px;letter-spacing:.05em}
    .am{background:rgba(201,168,76,.14);color:var(--gold)}.pm{background:rgba(74,155,143,.14);color:var(--teal)}
    .star{background:none;border:none;cursor:pointer;padding:3px;font-size:14px;color:var(--muted);transition:var(--ease);line-height:1}
    .star.on{color:var(--gold)}.star:hover{color:var(--gold);transform:scale(1.2)}
    footer{margin-top:56px;padding:24px 0;border-top:1px solid var(--bdr);text-align:center;font-family:var(--fm);font-size:10px;color:var(--muted)}
  </style>
</head>
<body>
<header>
  <div class="hi">
    <a class="brand" href="#">
      <div class="blogo">N</div>
      <span class="bname">Exam<span>Nova</span></span>
    </a>
    <div class="hsp"></div>
    <span class="sinfo" id="sinfo">Reading local data...</span>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <p class="hsup">Pearson IAL &middot; IGCSE &mdash; Static JSON Edition</p>
    <h1>Your <em>exam calendar</em>,<br>always in sync.</h1>
    <p class="hdesc">Powered by your custom JSON data. Track every paper and countdown to results.</p>
  </section>

  <div class="nstrip">
    <div>
      <div class="nlbl">Next Upcoming Exam</div>
      <div class="ntitle" id="ntitle">...</div>
      <div class="nsub" id="nsub"></div>
    </div>
    <div class="cdg">
      <div class="cdb"><div class="cdn" id="cdd">00</div><div class="cdl2">Days</div></div>
      <div class="cdb"><div class="cdn" id="cdh">00</div><div class="cdl2">Hrs</div></div>
      <div class="cdb"><div class="cdn" id="cdm">00</div><div class="cdl2">Min</div></div>
      <div class="cdb"><div class="cdn" id="cds">00</div><div class="cdl2">Sec</div></div>
    </div>
  </div>

  <div class="sr">
    <input class="si2" id="search" type="text" placeholder="Search subject, code, or series..." />
    <button class="meb" id="mebtn">&starf; My Exams</button>
  </div>

  <div id="cal"></div>
</main>

<footer>
  <div class="wrap">
    ExamNova &nbsp;&middot;&nbsp; Local JSON Backend &nbsp;&middot;&nbsp; GitHub Pages Ready
  </div>
</footer>

<script>
'use strict';
let ALL = [];
let MY = new Set();
let MYONLY = false;
let QRY = '';
let CDT = null;

const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Load Starred Exams from LocalStorage
function loadMy() {
  try {
    const r = JSON.parse(localStorage.getItem('ExamNova_my'));
    if (r) MY = new Set(r);
  } catch(e) {}
}

function saveMy() {
  localStorage.setItem('ExamNova_my', JSON.stringify([...MY]));
}

// Fetch the local JSON file
async function loadData() {
  try {
    const response = await fetch('timetables.json');
    if (!response.ok) throw new Error('JSON not found');
    const data = await response.json();
    
    // Map JSON to ExamNova structure
    ALL = data.map((e, index) => ({
      id: `exam_${index}`,
      series: e.series.toLowerCase().includes('summer') ? 'summer' : 
              e.series.toLowerCase().includes('oct') ? 'oct' : 
              e.series.toLowerCase().includes('jan') ? 'jan' : 'keydate',
      label: e.series,
      date: new Date(e.dateStr + 'T12:00:00'),
      dateStr: e.dateStr,
      subj: e.title,
      code: e.code,
      title: e.title,
      sess: e.sess,
      type: 'exam'
    }));

    ALL.sort((a,b) => a.date - b.date);
    document.getElementById('sinfo').textContent = 'Loaded ' + ALL.length + ' entries';
    updateCD();
    render();
  } catch (err) {
    document.getElementById('cal').innerHTML = `<div style="text-align:center; padding:50px; color:var(--red);">Error: ${err.message}. Ensure timetables.json is uploaded.</div>`;
  }
}

function updateCD() {
  const now = new Date();
  const pool = ALL.filter(e => e.date > now && (!MYONLY || MY.has(e.id)));
  if (!pool.length) {
    document.getElementById('ntitle').textContent = 'No upcoming exams';
    CDT = null;
    return;
  }
  const nx = pool[0];
  document.getElementById('ntitle').textContent = nx.title;
  document.getElementById('nsub').textContent = nx.date.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  
  const t = new Date(nx.date);
  t.setHours(nx.sess === 'PM' ? 13 : 9, 0, 0, 0);
  CDT = t;
}

function tickCD() {
  if (!CDT) return;
  const d = CDT - Date.now();
  const p = n => String(Math.max(0, n)).padStart(2, '0');
  if (d <= 0) return;
  document.getElementById('cdd').textContent = p(Math.floor(d/86400000));
  document.getElementById('cdh').textContent = p(Math.floor((d%86400000)/3600000));
  document.getElementById('cdm').textContent = p(Math.floor((d%3600000)/60000));
  document.getElementById('cds').textContent = p(Math.floor((d%60000)/1000));
}

function render() {
  const cal = document.getElementById('cal');
  const filtered = ALL.filter(e => {
    if (MYONLY && !MY.has(e.id)) return false;
    if (QRY && !(`${e.title} ${e.code} ${e.label}`.toLowerCase().includes(QRY.toLowerCase()))) return false;
    return true;
  });

  if (!filtered.length) {
    cal.innerHTML = '<div style="text-align:center; padding:50px; color:var(--muted);">No matching exams found.</div>';
    return;
  }

  const groups = {};
  filtered.forEach(e => {
    const k = `${e.date.getFullYear()}-${e.date.getMonth()}`;
    if (!groups[k]) groups[k] = [];
    groups[k].push(e);
  });

  cal.innerHTML = Object.keys(groups).sort().map(k => {
    const [yr, mo] = k.split('-');
    const list = groups[k];
    return `
      <div class="mb">
        <div class="mhd"><span class="mn">${MN[mo]}</span><span class="my2">${yr}</span></div>
        <div class="eg">${list.map(e => card(e)).join('')}</div>
      </div>`;
  }).join('');

  // Attach star listeners
  document.querySelectorAll('.star').forEach(btn => {
    btn.onclick = (ev) => {
      const id = btn.dataset.id;
      MY.has(id) ? MY.delete(id) : MY.add(id);
      saveMy();
      render();
      updateCD();
    };
  });
}

function card(e) {
  const starred = MY.has(e.id);
  const diff = Math.round((e.date - new Date().setHours(0,0,0,0)) / 86400000);
  const dc = diff < 0 ? 'past' : diff <= 7 ? 'soon' : 'future';
  const dt = diff < 0 ? Math.abs(diff)+'d ago' : diff === 0 ? 'Today' : diff+'d';

  return `
    <div class="ec ${e.series}${starred ? ' mine' : ''}">
      <div class="ct">
        <div class="cd2">
          <span class="cday">${e.date.getDate()}</span>
          <span class="cmon">${MN[e.date.getMonth()].slice(0,3).toUpperCase()}</span>
          <span class="cdow">${e.date.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase()}</span>
        </div>
        <div class="cm">
          <div class="cser">${e.label}</div>
          <div class="ctit">${e.title}</div>
          <div class="ccod">${e.code}</div>
        </div>
      </div>
      <div class="cf">
        <div>
          <span class="cdl ${dc}">${dt}</span>
          ${e.sess ? `<span class="cbdg ${e.sess.toLowerCase()}">${e.sess}</span>` : ''}
        </div>
        <button class="star ${starred ? 'on' : ''}" data-id="${e.id}">&starf;</button>
      </div>
    </div>`;
}

document.getElementById('search').oninput = (e) => { QRY = e.target.value; render(); };
document.getElementById('mebtn').onclick = () => { MYONLY = !MYONLY; document.getElementById('mebtn').classList.toggle('on'); render(); updateCD(); };

setInterval(tickCD, 1000);
loadMy();
loadData();
</script>
</body>
</html>
