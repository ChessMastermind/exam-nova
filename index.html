<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamNova | Your Academic Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0b10;
            --card-bg: #141620;
            --border: #232635;
            --accent: #c9a84c; /* Gold */
            --teal: #4a9b8f;
            --text-main: #f0f0f5;
            --text-dim: #8a8d9e;
            --danger: #ff4d4d;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Speed: Smooth scroll but reduced motion respect */
        html { scroll-behavior: smooth; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* --- Header & Hero --- */
        header { padding: 40px 0; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-bottom: 20px; }
        .logo-sq { width: 40px; height: 40px; background: linear-gradient(45deg, var(--accent), var(--teal)); border-radius: 8px; }
        .brand-name { font-weight: 800; font-size: 24px; color: #fff; letter-spacing: -1px; }
        .brand-name span { color: var(--accent); }

        /* --- Countdown Section (The Pulse) --- */
        .countdown-card {
            background: linear-gradient(135deg, rgba(201,168,76,0.1) 0%, rgba(10,11,16,1) 100%);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
            transition: transform 0.3s var(--ease);
        }

        .cd-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .cd-title { font-size: 28px; font-weight: 600; margin-bottom: 20px; }
        .cd-timer { display: flex; justify-content: center; gap: 20px; }
        .cd-unit { display: flex; flex-direction: column; min-width: 70px; }
        .cd-val { font-size: 42px; font-weight: 800; color: #fff; }
        .cd-lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }

        /* --- Controls --- */
        .controls { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; align-items: center; }
        .search-wrapper { flex: 1; position: relative; min-width: 280px; }
        .search-input { 
            width: 100%; background: var(--card-bg); border: 1px solid var(--border); 
            padding: 14px 20px; border-radius: 12px; color: #fff; font-size: 16px; 
            outline: none; transition: 0.2s;
        }
        .search-input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(74, 155, 143, 0.1); }
        
        .btn-toggle {
            padding: 14px 24px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text-dim); cursor: pointer;
            font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-toggle.active { background: rgba(74, 155, 143, 0.1); color: var(--teal); border-color: var(--teal); }

        /* --- Grid --- */
        .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 60px; }
        
        .exam-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 24px; position: relative; transition: 0.3s var(--ease);
            display: flex; flex-direction: column; gap: 12px;
        }
        .exam-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .exam-card.starred { border-left: 4px solid var(--accent); }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .series-tag { font-size: 10px; font-weight: 600; color: var(--accent); background: rgba(201,168,76,0.1); padding: 4px 8px; border-radius: 4px; }
        .unit-code { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text-dim); }
        .unit-title { font-size: 18px; font-weight: 600; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid var(--border); }
        .exam-date { font-size: 14px; font-weight: 500; }
        .star-btn { 
            background: none; border: none; cursor: pointer; font-size: 24px; color: var(--border); transition: 0.2s; 
        }
        .star-btn.active { color: var(--accent); transform: scale(1.1); }
        .sess-badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 3px; background: #232635; color: var(--teal); }

        /* --- Empty States --- */
        .funny-msg { padding: 80px 20px; text-align: center; }
        .funny-msg h2 { font-size: 24px; color: var(--text-dim); margin-bottom: 10px; }
        .funny-msg p { color: var(--accent); font-weight: 500; text-decoration: underline; cursor: pointer; }

        @media (max-width: 600px) {
            .cd-timer { gap: 10px; }
            .cd-val { font-size: 30px; }
            .cd-unit { min-width: 50px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <a href="#" class="nav-brand">
            <div class="logo-sq"></div>
            <h1 class="brand-name">Exam<span>Nova</span></h1>
        </a>
        <div id="countdown-root"></div>
    </header>

    <div class="controls">
        <div class="search-wrapper">
            <input type="text" id="search" class="search-input" placeholder="Search by subject code or title (e.g. WMA11)...">
        </div>
        <button id="toggle-starred" class="btn-toggle">
            <span>★</span> My Schedule
        </button>
    </div>

    <div id="exam-list" class="exam-grid"></div>
</div>

<script>
    'use strict';

    let ALL_EXAMS = [];
    let STARRED_IDS = new Set(JSON.parse(localStorage.getItem('Nova_Starred') || '[]'));
    let SHOW_STARRED_ONLY = false;
    let TICK_INTERVAL = null;

    const FUNNY_MESSAGES = [
        "Your schedule is emptier than my fridge on a Monday morning.",
        "No exams? Either you're a genius or you're forgetting something important.",
        "Your 'My Schedule' is currently a blank canvas of academic peace.",
        "Plot twist: You actually have to pick exams to see a countdown.",
        "Living life on the edge? Go ahead, star an exam... I dare you."
    ];

    // Fetch Data
    async function init() {
        try {
            const resp = await fetch('timetables.json');
            if (!resp.ok) throw new Error("No JSON found");
            const data = await resp.json();
            
            // Format & Sort
            ALL_EXAMS = data.map(ex => ({
                ...ex,
                jsDate: new Date(ex.dateStr + (ex.sess === 'PM' ? 'T13:30:00' : 'T09:00:00'))
            })).sort((a, b) => a.jsDate - b.jsDate);

            render();
            startCountdown();
        } catch (e) {
            document.getElementById('exam-list').innerHTML = `<h2>Please ensure 'timetables.json' exists.</h2>`;
        }
    }

    function toggleStar(id) {
        if (STARRED_IDS.has(id)) STARRED_IDS.delete(id);
        else STARRED_IDS.add(id);
        
        localStorage.setItem('Nova_Starred', JSON.stringify([...STARRED_IDS]));
        render();
        startCountdown();
    }

    function startCountdown() {
        if (TICK_INTERVAL) clearInterval(TICK_INTERVAL);
        
        const update = () => {
            const now = new Date();
            // Find next exam among starred
            const next = ALL_EXAMS.find(ex => STARRED_IDS.has(ex.id) && ex.jsDate > now);
            const root = document.getElementById('countdown-root');

            if (!STARRED_IDS.size) {
                const msg = FUNNY_MESSAGES[Math.floor(Math.random() * FUNNY_MESSAGES.length)];
                root.innerHTML = `
                    <div class="countdown-card">
                        <div class="cd-label">Status: Chilling</div>
                        <div class="cd-title">${msg}</div>
                        <p style="color:var(--accent); cursor:pointer;" onclick="document.getElementById('search').focus()">👇 Hint: Use search and hit the star to begin.</p>
                    </div>`;
                return;
            }

            if (!next) {
                root.innerHTML = `<div class="countdown-card"><div class="cd-title">All exams finished! Time to touch grass. 🌱</div></div>`;
                return;
            }

            const diff = next.jsDate - now;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);

            root.innerHTML = `
                <div class="countdown-card">
                    <div class="cd-label">Next Deadline: ${next.code}</div>
                    <div class="cd-title">${next.title}</div>
                    <div class="cd-timer">
                        <div class="cd-unit"><span class="cd-val">${d}</span><span class="cd-lbl">Days</span></div>
                        <div class="cd-unit"><span class="cd-val">${h}</span><span class="cd-lbl">Hrs</span></div>
                        <div class="cd-unit"><span class="cd-val">${m}</span><span class="cd-lbl">Min</span></div>
                        <div class="cd-unit"><span class="cd-val">${s}</span><span class="cd-lbl">Sec</span></div>
                    </div>
                </div>`;
        };

        update();
        TICK_INTERVAL = setInterval(update, 1000);
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('exam-list');
        
        const filtered = ALL_EXAMS.filter(ex => {
            const matchSearch = ex.title.toLowerCase().includes(query) || ex.code.toLowerCase().includes(query);
            const matchStarred = SHOW_STARRED_ONLY ? STARRED_IDS.has(ex.id) : true;
            return matchSearch && matchStarred;
        });

        container.innerHTML = filtered.map(ex => `
            <div class="exam-card ${STARRED_IDS.has(ex.id) ? 'starred' : ''}">
                <div class="card-top">
                    <span class="series-tag">${ex.series}</span>
                    <span class="unit-code">${ex.code}</span>
                </div>
                <div class="unit-title">${ex.title}</div>
                <div class="card-footer">
                    <div class="exam-date">
                        ${ex.jsDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}
                        <span class="sess-badge">${ex.sess}</span>
                    </div>
                    <button class="star-btn ${STARRED_IDS.has(ex.id) ? 'active' : ''}" onclick="toggleStar('${ex.id}')">
                        ${STARRED_IDS.has(ex.id) ? '★' : '☆'}
                    </button>
                </div>
            </div>
        `).join('');
    }

    // Events
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('toggle-starred').addEventListener('click', (e) => {
        SHOW_STARRED_ONLY = !SHOW_STARRED_ONLY;
        e.target.closest('button').classList.toggle('active', SHOW_STARRED_ONLY);
        render();
    });

    init();
</script>

</body>
</html>
  </div>

  <div class="sr">
    <input class="si2" id="search" type="text" placeholder="Search subject, code, or series..." />
    <button class="meb" id="mebtn">&starf; My Exams</button>
  </div>

  <div id="cal"></div>
</main>

<footer>
  <div class="wrap">
    ExamNova &nbsp;&middot;&nbsp; Local JSON Backend &nbsp;&middot;&nbsp; GitHub Pages Ready
  </div>
</footer>

<script>
'use strict';
let ALL = [];
let MY = new Set();
let MYONLY = false;
let QRY = '';
let CDT = null;

const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Load Starred Exams from LocalStorage
function loadMy() {
  try {
    const r = JSON.parse(localStorage.getItem('ExamNova_my'));
    if (r) MY = new Set(r);
  } catch(e) {}
}

function saveMy() {
  localStorage.setItem('ExamNova_my', JSON.stringify([...MY]));
}

// Fetch the local JSON file
async function loadData() {
  try {
    const response = await fetch('timetables.json');
    if (!response.ok) throw new Error('JSON not found');
    const data = await response.json();
    
    // Map JSON to ExamNova structure
    ALL = data.map((e, index) => ({
      id: `exam_${index}`,
      series: e.series.toLowerCase().includes('summer') ? 'summer' : 
              e.series.toLowerCase().includes('oct') ? 'oct' : 
              e.series.toLowerCase().includes('jan') ? 'jan' : 'keydate',
      label: e.series,
      date: new Date(e.dateStr + 'T12:00:00'),
      dateStr: e.dateStr,
      subj: e.title,
      code: e.code,
      title: e.title,
      sess: e.sess,
      type: 'exam'
    }));

    ALL.sort((a,b) => a.date - b.date);
    document.getElementById('sinfo').textContent = 'Loaded ' + ALL.length + ' entries';
    updateCD();
    render();
  } catch (err) {
    document.getElementById('cal').innerHTML = `<div style="text-align:center; padding:50px; color:var(--red);">Error: ${err.message}. Ensure timetables.json is uploaded.</div>`;
  }
}

function updateCD() {
  const now = new Date();
  const pool = ALL.filter(e => e.date > now && (!MYONLY || MY.has(e.id)));
  if (!pool.length) {
    document.getElementById('ntitle').textContent = 'No upcoming exams';
    CDT = null;
    return;
  }
  const nx = pool[0];
  document.getElementById('ntitle').textContent = nx.title;
  document.getElementById('nsub').textContent = nx.date.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  
  const t = new Date(nx.date);
  t.setHours(nx.sess === 'PM' ? 13 : 9, 0, 0, 0);
  CDT = t;
}

function tickCD() {
  if (!CDT) return;
  const d = CDT - Date.now();
  const p = n => String(Math.max(0, n)).padStart(2, '0');
  if (d <= 0) return;
  document.getElementById('cdd').textContent = p(Math.floor(d/86400000));
  document.getElementById('cdh').textContent = p(Math.floor((d%86400000)/3600000));
  document.getElementById('cdm').textContent = p(Math.floor((d%3600000)/60000));
  document.getElementById('cds').textContent = p(Math.floor((d%60000)/1000));
}

function render() {
  const cal = document.getElementById('cal');
  const filtered = ALL.filter(e => {
    if (MYONLY && !MY.has(e.id)) return false;
    if (QRY && !(`${e.title} ${e.code} ${e.label}`.toLowerCase().includes(QRY.toLowerCase()))) return false;
    return true;
  });

  if (!filtered.length) {
    cal.innerHTML = '<div style="text-align:center; padding:50px; color:var(--muted);">No matching exams found.</div>';
    return;
  }

  const groups = {};
  filtered.forEach(e => {
    const k = `${e.date.getFullYear()}-${e.date.getMonth()}`;
    if (!groups[k]) groups[k] = [];
    groups[k].push(e);
  });

  cal.innerHTML = Object.keys(groups).sort().map(k => {
    const [yr, mo] = k.split('-');
    const list = groups[k];
    return `
      <div class="mb">
        <div class="mhd"><span class="mn">${MN[mo]}</span><span class="my2">${yr}</span></div>
        <div class="eg">${list.map(e => card(e)).join('')}</div>
      </div>`;
  }).join('');

  // Attach star listeners
  document.querySelectorAll('.star').forEach(btn => {
    btn.onclick = (ev) => {
      const id = btn.dataset.id;
      MY.has(id) ? MY.delete(id) : MY.add(id);
      saveMy();
      render();
      updateCD();
    };
  });
}

function card(e) {
  const starred = MY.has(e.id);
  const diff = Math.round((e.date - new Date().setHours(0,0,0,0)) / 86400000);
  const dc = diff < 0 ? 'past' : diff <= 7 ? 'soon' : 'future';
  const dt = diff < 0 ? Math.abs(diff)+'d ago' : diff === 0 ? 'Today' : diff+'d';

  return `
    <div class="ec ${e.series}${starred ? ' mine' : ''}">
      <div class="ct">
        <div class="cd2">
          <span class="cday">${e.date.getDate()}</span>
          <span class="cmon">${MN[e.date.getMonth()].slice(0,3).toUpperCase()}</span>
          <span class="cdow">${e.date.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase()}</span>
        </div>
        <div class="cm">
          <div class="cser">${e.label}</div>
          <div class="ctit">${e.title}</div>
          <div class="ccod">${e.code}</div>
        </div>
      </div>
      <div class="cf">
        <div>
          <span class="cdl ${dc}">${dt}</span>
          ${e.sess ? `<span class="cbdg ${e.sess.toLowerCase()}">${e.sess}</span>` : ''}
        </div>
        <button class="star ${starred ? 'on' : ''}" data-id="${e.id}">&starf;</button>
      </div>
    </div>`;
}

document.getElementById('search').oninput = (e) => { QRY = e.target.value; render(); };
document.getElementById('mebtn').onclick = () => { MYONLY = !MYONLY; document.getElementById('mebtn').classList.toggle('on'); render(); updateCD(); };

setInterval(tickCD, 1000);
loadMy();
loadData();
</script>
</body>
</html>
